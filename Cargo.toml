[workspace]
resolver = "3"
members = ["crates/cc_core", "crates/cc_geom", "crates/cc_views", "crates/cc_render", "crates/cc_ifc", "crates/cc_engine", "crates/cc_cli", "crates/cc_app"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Francis Rebouças <francisreboucas@gmail.com>"]
repository = "https://github.com/tectskill-dev/tectskill-bim"

[workspace.dependencies]
cc_core = { path = "crates/cc_core" }
cc_geom = { path = "crates/cc_geom" }
cc_views = { path = "crates/cc_views" }
cc_render = { path = "crates/cc_render" }
cc_ifc = { path = "crates/cc_ifc" }
cc_engine = { path = "crates/cc_engine" }

eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence", "accesskit", "links", "x11", "wayland"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_dock = "0.21.1"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
wgpu = "30.0.1"
glam = { version = "0.34.1", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12.2"
earcutr = "0.5.0"
rfd = "0.17.2"
png = "0.18.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror = "2"
serde_json = "1"
schemars = "1"
log = "0.4"
sys-locale = "0.3.2"
env_logger = "0.11"
resvg = { version = "0.45.1", default-features = false }
# Glyph outlines for raster export (cc_views), the version egui already uses.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# Text shaping for exported glyphs (the version egui already uses).
harfrust = "0.12.0"
# Font subsets embedded in exported PDFs.
subsetter = { version = "0.2.6", default-features = false }
# Update notice (cc_app): HTTPS with rustls, no other TLS stack.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

# Robustness rules (see AGENTS.md): no unsafe, and no panics outside tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
