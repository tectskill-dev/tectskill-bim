name: Release

# TectSkill BIM: Windows only (ZIP + MSI installer). Push a tag such as v0.7.0
# (CHANGELOG.md must have a section for that version).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Installer tool, pinned (packaging/windows holds the files it builds from).
  WIX_VERSION: "5.0.2"

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p cc_app -p cc_cli --target x86_64-pc-windows-msvc
      - name: ZIP (portable)
        shell: bash
        run: |
          name="tectskill-bim-${GITHUB_REF_NAME}-windows-x64"
          bin="target/x86_64-pc-windows-msvc/release"
          mkdir -p "dist/$name/fonts" "dist/$name/examples"
          cp README.th.md README.md LICENSE CHANGELOG.md "dist/$name/"
          cp assets/fonts/OFL-Inter.txt assets/fonts/OFL-Sarabun.txt "dist/$name/fonts/"
          cp examples/casa_simples.ccad "dist/$name/examples/"
          cp "$bin/tectskill-bim.exe" "$bin/ccad.exe" "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          rm -rf "dist/$name"
      - name: Install WiX
        shell: bash
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add --global "WixToolset.UI.wixext/$WIX_VERSION"
      - name: MSI installer
        shell: bash
        run: |
          wix --version
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          python packaging/windows/license_rtf.py LICENSE "$RUNNER_TEMP/License.rtf"
          wix build packaging/windows/tectskill-bim.wxs -arch x64 -ext WixToolset.UI.wixext \
            -d "Version=${version%%[-+]*}" \
            -d "BinDir=target/x86_64-pc-windows-msvc/release" \
            -d "LicenseRtf=$RUNNER_TEMP/License.rtf" \
            -o "dist/tectskill-bim-${GITHUB_REF_NAME}-windows-x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.msi

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            echo "TectSkill BIM $GITHUB_REF_NAME — BIM ภาษาไทย ใช้ฟรีและเปิดซอร์สโค้ด พัฒนาต่อจาก ConstructCAD ของ Francis Rebouças"
            echo
            echo "ดาวน์โหลดไฟล์ .msi เพื่อติดตั้งบน Windows หรือไฟล์ .zip เพื่อใช้งานโดยไม่ต้องติดตั้ง"
            echo
            echo "## การเปลี่ยนแปลงของ ConstructCAD $version"
            echo
            cat notes.md
          } > release-notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made on the website first (which creates the tag) gets the files added.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "TectSkill BIM $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "TectSkill BIM $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
